<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yamir Packaging Pvt. Ltd.</title>
<meta name="description" content="Yamir Packaging Pvt. Ltd. — paperboard packaging, 3 plants in Gujarat. Our website is being upgraded.">
<meta name="robots" content="noindex, follow">

<style>
  :root { --bg:#faf8f5; --text:#2b2b2b; --soft:#5c5c5c; --line:#e6e1da; --primary:#1c3f60; }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
  }
  main { max-width:30rem; width:100%; text-align:center; }
  .logo { width:min(300px,78%); height:auto; margin:0 auto 2.5rem; display:block; }
  h1 { font-size:1.25rem; font-weight:500; letter-spacing:0.01em; margin:0 0 0.6rem; color:var(--primary); }
  p { margin:0 0 0.4rem; color:var(--soft); }
  hr { border:0; border-top:1px solid var(--line); width:3rem; margin:2rem auto; }
  .contact a { color:var(--primary); text-decoration:none; }
  .contact a:hover { text-decoration:underline; }
  footer { margin-top:3rem; font-size:0.85rem; color:var(--soft); }
</style>
</head>

<main>

  <p class="contact"><a href="https://www.linkedin.com/company/yamir-packaging-pvt-ltd/" rel="noopener">LinkedIn</a></p>
  <footer>&copy; Yamir Packaging Pvt. Ltd.</footer>
</main>
</body>
</html>
